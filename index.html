<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F4E79">
<title>Visor Tarimas - Login</title>

<!-- ⚠️ FAVICON: estas 4 líneas son las que faltaban -->
<link rel="icon" type="image/png" sizes="192x192" href="./icono_192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icono_512x512.png">
<link rel="shortcut icon" type="image/png" href="./icono_192x192.png">
<link rel="apple-touch-icon" href="./icono_192x192.png">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-container">
  <div class="login-logo">
    <div class="logo-icon">📦</div>
    <h1>Visor Tarimas</h1>
    <p class="subtitle">Sistema de consulta de movimientos</p>
  </div>

  <form id="login-form" class="login-form">
    <div class="input-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required placeholder="tu.usuario">
    </div>

    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-primary">Entrar</button>

    <p id="error-msg" class="error-msg"></p>
  </form>

  <p class="footer-text">Mediese © 2026</p>
</div>

<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.initLogin();
  });
</script>
</body>
</html>

<!-- PANTALLA: Lista de Pedidos -->
<div id="pantalla-pedidos" class="pantalla" style="display:none;">
  <div class="header-app">
    <button onclick="volverMenu()">←</button>
    <h2>Pedidos</h2>
  </div>

  <div class="contenido">
    <button class="btn-primario" onclick="mostrarFormPedido()">+ Nuevo pedido</button>

    <div id="lista-pedidos" class="lista-pedidos">
      <!-- Se llena dinámicamente -->
    </div>
  </div>
</div>

<!-- PANTALLA: Formulario de pedido -->
<div id="pantalla-form-pedido" class="pantalla" style="display:none;">
  <div class="header-app">
    <button onclick="volverListaPedidos()">←</button>
    <h2 id="titulo-form-pedido">Nuevo pedido</h2>
  </div>

  <div class="contenido">
    <label>PO</label>
    <input type="text" id="form-po" placeholder="14203817" inputmode="numeric">

    <label>CEDIS</label>
    <input type="text" id="form-cedis" placeholder="006" inputmode="numeric" maxlength="3">

    <label>Fecha de entrega (opcional)</label>
    <input type="date" id="form-fecha-entrega">

    <h3>SKUs</h3>
    <div id="lista-skus-form"></div>
    <button class="btn-secundario" onclick="agregarFilaSKU()">+ Agregar SKU</button>

    <div class="botones-form">
      <button class="btn-primario" onclick="guardarPedidoForm()">Guardar y calcular</button>
      <button class="btn-cancelar" onclick="volverListaPedidos()">Cancelar</button>
    </div>
  </div>
</div>

<!-- PANTALLA: Detalle / resultado -->
<div id="pantalla-detalle-pedido" class="pantalla" style="display:none;">
  <div class="header-app">
    <button onclick="volverListaPedidos()">←</button>
    <h2 id="titulo-detalle-pedido">Pedido</h2>
  </div>

  <div class="contenido">
    <div id="info-pedido"></div>

    <div class="tabs">
      <button class="tab activo" onclick="cambiarTabPedido('consolidado')">Consolidado</button>
      <button class="tab" onclick="cambiarTabPedido('por-sku')">Por SKU</button>
    </div>

    <div id="tab-consolidado" class="tab-contenido"></div>
    <div id="tab-por-sku" class="tab-contenido" style="display:none;"></div>

    <div class="acciones-detalle">
      <button class="btn-secundario" onclick="refrescarStock()">🔄 Actualizar stock</button>
      <button class="btn-secundario" onclick="editarPedidoActual()">✏️ Editar</button>
      <button class="btn-peligro" onclick="eliminarPedidoActual()">🗑 Eliminar</button>
    </div>
  </div>
</div>
