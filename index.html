<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F4E79">
<title>Visor Tarimas - Login</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-container">
  <div class="login-logo">
    <div class="logo-icon">📦</div>
    <h1>Visor Tarimas</h1>
    <p class="subtitle">Sistema de consulta de movimientos</p>
  </div>

  <form id="login-form" class="login-form">
    <div class="input-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required placeholder="tu.usuario">
    </div>

    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-primary">Entrar</button>

    <p id="error-msg" class="error-msg"></p>
  </form>

  <p class="footer-text">Mediese © 2026</p>
</div>

<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.initLogin();
  });
</script>
</body>
</html>
